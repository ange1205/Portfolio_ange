<section class="contact">
  <h2>Me contacter</h2>
  <p class="contact-intro">
    Une idée, une question, une collaboration ?  
    Remplissez le formulaire ci-dessous et je vous répondrai au plus vite !
  </p>

  <form class="contact-form" action="https://formspree.io/f/YOUR_ID_ICI" method="POST">
    <div class="form-group double">
      <input type="text" name="prenom" placeholder="Prénom" required>
      <input type="text" name="nom" placeholder="Nom" required>
    </div>

    <div class="form-group">
      <input type="tel" name="telephone" placeholder="Numéro de téléphone" required>
    </div>

    <div class="form-group">
      <textarea name="message" placeholder="Votre message..." rows="5" required></textarea>
    </div>

    <button type="submit">Envoyer</button>
  </form>
</section>
